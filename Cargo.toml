[package]
name = "seer-sync"
description = "View-key-only Zcash chain sync"
version = "0.0.1"
edition = "2021"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
categories = ["cryptography::cryptocurrencies"]
keywords = ["zcash", "sync", "lightwalletd", "viewing-key", "orchard"]
publish = false

[features]
default = ["db"]
db = ["dep:rusqlite"]

[dependencies]
# Per-pool note-encryption primitives.
zcash_note_encryption = "0.4"
orchard = { version = "0.13", default-features = false, features = ["std"] }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false, features = ["std"] }

# Upstream Zcash stack, crates.io only.
zcash_protocol = { version = "0.8", default-features = false, features = ["std"] }
zcash_keys = { version = "0.13", default-features = false, features = ["orchard", "sapling", "transparent-inputs"] }
zcash_address = "0.11"
zcash_transparent = { version = "0.7", default-features = false }

# gRPC + async (driver layer).
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots", "codegen"] }
tonic-prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1"
prost = "0.14"
http = "1"
futures = "0.3"

# Parallelism.
rayon = "1"
crossbeam-channel = "0.5"

# Persistence (optional).
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

# Tooling.
anyhow = "1"
thiserror = "2"
zip32 = "0.2"

[build-dependencies]
tonic-prost-build = { version = "0.14", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"

[[bench]]
name = "decrypt"
harness = false
