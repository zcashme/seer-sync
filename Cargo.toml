[package]
name = "seer-sync"
description = "View-key-only Zcash chain sync"
version = "0.1.0"
authors = ["Julian Abraham <julesverne505@gmail.com>"]
edition = "2021"
rust-version = "1.85.1"
license = "MIT"
repository = "https://github.com/zcashme/seer-sync"
readme = "README.md"
categories = ["cryptography::cryptocurrencies"]
keywords = ["zcash", "sync", "lightwalletd", "viewing-key", "orchard"]
exclude = [
    "AGENTS.md",
    "docs/",
    "benches/",
    "bench-data/",
    "Cargo.lock",
    ".gitignore",
]

[features]
# `cargo add seer-sync` syncs against lightwalletd out of the box — the gRPC
# client and live engine are core. `db` is the only knob: opt-in persistence via
# the reference SQLite consumer. Without it you bring your own store and consume
# the engine's notes directly.
default = []
db = ["dep:rusqlite"]
# Orchard note-commitment tree + inclusion witnesses, persisted via `db`. Opt-in
# because it pulls shardtree and ingests every on-chain commitment, which a plain
# balance scanner neither needs nor should pay for.
commitment-tree = ["db", "dep:shardtree", "dep:incrementalmerkletree", "dep:byteorder", "dep:zcash_encoding"]

[dependencies]
# ── Core (always compiled, sans-IO) ──────────────────────────────────────────
# Per-pool note-encryption primitives.
zcash_note_encryption = "0.4"
orchard = { version = "0.14", default-features = false, features = ["std"] }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false, features = ["std"] }
# Upstream Zcash stack, crates.io only.
zcash_protocol = { version = "0.9", default-features = false, features = ["std"] }
zcash_keys = { version = "0.14", default-features = false, features = ["orchard", "sapling", "transparent-inputs"] }
zcash_transparent = { version = "0.8", default-features = false, features = ["std"] }
zip32 = "0.2"
# Decoder for the generated proto *message* types (the gRPC client is generated
# alongside them; see build.rs).
prost = "0.14"

# ── Network / async cluster (the live layer) ─────────────────────────────────
# Full-transaction parsing for memo enrichment (a note's memo lives in the full
# ciphertext that compact blocks truncate).
zcash_primitives = { version = "0.28", default-features = false }
# gRPC + async (driver layer).
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots", "codegen"] }
tonic-prost = "0.14"
tokio = { version = "1", features = ["rt", "sync"] }
tokio-stream = "0.1"
http = "1"
thiserror = "2"

# ── `db` (persistence, optional) ─────────────────────────────────────────────
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# Orchard note-commitment tree backing for the `db` feature. shardtree is the
# engine librustzcash uses; the rest support the vendored shard serialization
# (see src/db/shardtree_serialization.rs). zcash_client_backend is deliberately
# NOT pulled — only its ~120-line shard codec is vendored.
shardtree = { version = "0.6", optional = true }
incrementalmerkletree = { version = "0.8", optional = true }
byteorder = { version = "1", optional = true }
zcash_encoding = { version = "0.4", optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "router", "codegen"] }
zcash_keys = { version = "0.14", default-features = false, features = ["orchard", "sapling", "transparent-inputs"] }
zip32 = "0.2"
orchard = { version = "0.14", default-features = false, features = ["std"] }
zcash_note_encryption = "0.4"

[[bench]]
name = "decrypt"
harness = false

[[example]]
name = "balance"
required-features = ["db"]
