[package]
name = "seer-sync"
description = "View-key-only Zcash chain sync"
version = "0.0.1"
authors = ["Julian Abraham <julesverne505@gmail.com>"]
edition = "2021"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
categories = ["cryptography::cryptocurrencies"]
keywords = ["zcash", "sync", "lightwalletd", "viewing-key", "orchard"]
publish = false

[features]
# Default to the lightwalletd client so `cargo add seer-sync` can sync out of the
# box. The DB is opt-in persistence; the bare crate (no features) is a pure,
# sans-IO decryptor.
default = ["lwd"]
# "Talk to lightwalletd": the gRPC client, memo enrichment, and the live
# orchestration engine — everything that reaches the network. Pulls the async +
# gRPC + full-transaction-parsing cluster.
lwd = [
    "dep:tonic",
    "dep:tonic-prost",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:http",
    "dep:futures",
    "dep:zcash_primitives",
    "dep:anyhow",
    "dep:thiserror",
]
# "Remember across runs": the reference SQLite consumer.
db = ["dep:rusqlite"]

[dependencies]
# ── Core (always compiled, sans-IO) ──────────────────────────────────────────
# Per-pool note-encryption primitives.
zcash_note_encryption = "0.4"
orchard = { version = "0.13", default-features = false, features = ["std"] }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false, features = ["std"] }
# Upstream Zcash stack, crates.io only.
zcash_protocol = { version = "0.8", default-features = false, features = ["std"] }
zcash_keys = { version = "0.13", default-features = false, features = ["orchard", "sapling", "transparent-inputs"] }
zip32 = "0.2"
# Decoder for the generated proto *message* types (always present; the gRPC
# client is generated only under `lwd`, see build.rs).
prost = "0.14"

# ── `lwd` cluster (network / async, optional) ────────────────────────────────
# Full-transaction parsing for memo enrichment (a note's memo lives in the full
# ciphertext that compact blocks truncate).
zcash_primitives = { version = "0.27", default-features = false, optional = true }
# gRPC + async (driver layer).
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots", "codegen"], optional = true }
tonic-prost = { version = "0.14", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
tokio-stream = { version = "0.1", optional = true }
http = { version = "1", optional = true }
futures = { version = "0.3", optional = true }
anyhow = { version = "1", optional = true }
thiserror = { version = "2", optional = true }

# ── `db` (persistence, optional) ─────────────────────────────────────────────
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio-test = "0.4"

[[bench]]
name = "decrypt"
harness = false
