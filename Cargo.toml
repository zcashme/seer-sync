[package]
name = "seer-sync"
description = "View-key-only Zcash chain sync"
version = "0.3.0"
authors = ["Julian Abraham <julesverne505@gmail.com>"]
edition = "2021"
# Ironwood stack (orchard 0.15 / zcash_keys ≥0.15 / zcash_primitives ≥0.29).
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/zcashme/seer-sync"
readme = "README.md"
categories = ["cryptography::cryptocurrencies"]
keywords = ["zcash", "sync", "lightwalletd", "viewing-key", "orchard"]
exclude = [
    "AGENTS.md",
    "docs/",
    "benches/",
    "bench-data/",
    "Cargo.lock",
    ".gitignore",
]

[features]
default = []

[dependencies]
# ── Core ──────────────────────────────────────────
# Per-pool note-encryption primitives.
zcash_note_encryption = "0.4"
# Local monorepo: path → zns-orchard. crates.io: version 0.15.5 (upstream Ironwood).
# [patch.crates-io] keeps zcash_keys/primitives on the same local orchard identity.
orchard = { version = "0.15.5", path = "../zns-orchard", default-features = false, features = ["std"] }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false, features = ["std"] }
# — Ironwood / orchard-0.15 line.
zcash_protocol = { version = "0.10", default-features = false, features = ["std"] }
zcash_keys = { version = "0.15", default-features = false, features = ["orchard", "sapling", "transparent-inputs"] }
zcash_transparent = { version = "0.9", default-features = false, features = ["std"] }
zip32 = "0.2"
# Decoder for the generated proto *message* types (the gRPC client is generated
# alongside them; see build.rs).
prost = "0.14"

# ── Network / async cluster (the live layer) ─────────────────────────────────
# Full-transaction parsing for memo enrichment (a note's memo lives in the full
# ciphertext that compact blocks truncate).
zcash_primitives = { version = "0.29", default-features = false }
# gRPC + async (driver layer).
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots", "codegen"] }
tonic-prost = "0.14"
tokio = { version = "1", features = ["rt", "sync"] }
tokio-stream = "0.1"
http = "1"
thiserror = "2"

# ── Persistence (always compiled) ────────────────────────────────────────────
rusqlite = { version = "0.32", features = ["bundled"] }
zcash_script = "0.4"

[build-dependencies]
tonic-prost-build = { version = "0.14", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "router", "codegen"] }
zcash_keys = { version = "0.15", default-features = false, features = ["orchard", "sapling", "transparent-inputs"] }
zip32 = "0.2"
orchard = { version = "0.15.5", path = "../zns-orchard", default-features = false, features = ["std"] }
zcash_note_encryption = "0.4"

# One orchard identity for the whole monorepo graph (stripped on crates.io publish).
[patch.crates-io]
orchard = { path = "../zns-orchard" }

[[bench]]
name = "decrypt"
harness = false

[[example]]
name = "sync"

[[example]]
name = "balance"
