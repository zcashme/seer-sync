[package]
name = "seer-sync"
description = "View-key-only Zcash chain sync"
version = "0.0.1"
edition = "2021"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
categories = ["cryptography::cryptocurrencies"]
keywords = ["zcash", "sync", "lightwalletd", "viewing-key", "orchard"]
publish = false

[dependencies]
# Per-pool note-encryption primitives.
zcash_note_encryption = "0.4"
orchard = { version = "0.13", default-features = false, features = ["std"] }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false, features = ["std"] }

# Upstream Zcash stack, crates.io only.
zcash_primitives = { version = "0.27", default-features = false, features = ["std"] }
zcash_protocol = { version = "0.8", default-features = false, features = ["std"] }
zcash_keys = { version = "0.13", default-features = false, features = ["orchard", "sapling"] }

# gRPC + async (driver layer).
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
prost = "0.14"
http = "1"
futures = "0.3"
async-trait = "0.1"

# Parallelism.
rayon = "1"
crossbeam-channel = "0.5"

# Tooling.
anyhow = "1"
thiserror = "1"
tracing = "0.1"
hex = "0.4"

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
# For the Zebra JSON-RPC downloader example.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"

[[bench]]
name = "decrypt"
harness = false
