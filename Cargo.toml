[package]
name = "seer-sync"
description = "View-key-only Zcash chain sync"
version = "0.6.0"
authors = ["Julian Abraham <julesverne505@gmail.com>"]
edition = "2021"
# NU7 stack (orchard 0.16 / zcash_keys 0.17-pre / zcash_primitives 0.31-pre,
# BranchId::Nu7 = 0x7719_0ad9, testnet-activated).
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/zcashme/seer-sync"
readme = "README.md"
categories = ["cryptography::cryptocurrencies"]
keywords = ["zcash", "sync", "lightwalletd", "viewing-key", "orchard"]
exclude = [
    "AGENTS.md",
    "docs/",
    "Cargo.lock",
    ".gitignore",
]

[features]
default = []
# Relaxed Ironwood trial decryption for notes whose commitment is supplied by
# the action rather than derived from the plaintext rseed (see zns-orchard's
# `unsafe-zns`). Results are surfaced unverified; the caller checks bindings.
zns-decrypt = ["dep:zns_orchard"]

[dependencies]
# ── Core ──────────────────────────────────────────
# Per-pool note-encryption primitives.
zcash_note_encryption = "0.5.1"
# Upstream orchard, the same crate zcash_keys and zcash_primitives use.
orchard = { version = "0.16", default-features = false, features = ["std"] }
# The ZNS orchard fork, for the relaxed Ironwood scan only. Its library is also
# named `orchard`, so it is renamed; values cross by their byte encodings.
zns_orchard = { package = "zns-orchard", version = "0.16.0", optional = true, default-features = false, features = ["std", "unsafe-zns"] }
sapling = { package = "sapling-crypto", version = "0.9", default-features = false, features = ["std"] }
# NU7 stack — crates.io pre-releases carrying `BranchId::Nu7` (0x7719_0ad9,
# testnet-activated).
zcash_protocol = { version = "0.11.0-pre.0", default-features = false, features = ["std"] }
zcash_keys = { version = "0.17.0-pre.1", default-features = false, features = ["orchard", "sapling", "transparent-inputs"] }
zcash_transparent = { version = "0.11.0-pre.1", default-features = false, features = ["std"] }
zip32 = "0.3"
# Decoder for the generated proto *message* types (the gRPC client is generated
# alongside them; see build.rs).
prost = "0.14"

# ── Network / async cluster (the live layer) ─────────────────────────────────
# Full-transaction parsing for memo enrichment (a note's memo lives in the full
# ciphertext that compact blocks truncate).
zcash_primitives = { version = "0.31.0-pre.1", default-features = false }
# gRPC + async (driver layer).
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots", "codegen"] }
tonic-prost = "0.14"
tokio = { version = "1", features = ["rt", "sync"] }
tokio-stream = "0.1"
http = "1"
thiserror = "2"

# ── Persistence (always compiled) ────────────────────────────────────────────
rusqlite = { version = "0.32", features = ["bundled"] }
zcash_script = "0.6"

[build-dependencies]
tonic-prost-build = { version = "0.14", default-features = false }

[dev-dependencies]
futures = "0.3"
rand = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "router", "codegen"] }
zcash_keys = { version = "0.17.0-pre.1", default-features = false, features = ["orchard", "sapling", "transparent-inputs"] }
zip32 = "0.3"
zcash_note_encryption = "0.5.1"

[[example]]
name = "sync"

[[example]]
name = "balance"

[[example]]
name = "taddr_txs"
